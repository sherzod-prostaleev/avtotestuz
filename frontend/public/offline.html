<!DOCTYPE html>
<html lang="uz">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0E1218" />
    <title>Driver Go — Offline</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0e1218;
        --fg: #f1f3f6;
        --muted: #9aa3b2;
        --accent: #3d9a6a;
        --line: rgba(241, 243, 246, 0.12);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        font-family: "Manrope", "Segoe UI", sans-serif;
        background:
          radial-gradient(ellipse 80% 50% at 50% -10%, rgba(61, 154, 106, 0.18), transparent),
          var(--bg);
        color: var(--fg);
      }
      main {
        width: min(28rem, 100%);
        text-align: center;
      }
      img {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
        object-fit: cover;
        margin-bottom: 1.25rem;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-family: "Baloo 2", "Manrope", sans-serif;
        font-size: clamp(1.6rem, 4vw, 2rem);
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        color: var(--muted);
        line-height: 1.5;
      }
      button {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--accent);
        color: #06110b;
        font: inherit;
        font-weight: 600;
        padding: 0.75rem 1.25rem;
        border-radius: 0.75rem;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid var(--fg);
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo-512.png" alt="Driver Go" width="72" height="72" />
      <h1>Driver Go</h1>
      <p>
        Internet aloqasi yo‘q. Ilova qobig‘i saqlangan — qayta ulanib, mashqni
        davom ettiring.
      </p>
      <button type="button" onclick="location.reload()">Qayta urinish</button>
    </main>
  </body>
</html>

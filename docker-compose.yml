services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: avtotest
      POSTGRES_PASSWORD: avtotest
      POSTGRES_DB: avtotest
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtotest"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: avtotest
      MINIO_ROOT_PASSWORD: avtotest123
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 avtotest avtotest123; do sleep 1; done;
      mc mb -p local/media || true;
      mc anonymous set download local/media;
      exit 0"
volumes:
  pgdata:
  minio-data:

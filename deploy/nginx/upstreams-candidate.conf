# App-only candidate slot. Stateful media remains on the stable MinIO port.
#
# keepalive_timeout mirrors upstreams-stable.conf -- see the invariant documented
# there. A candidate slot runs the same images, so it inherits the same
# "upstream must outlive nginx's reuse window" contract.
upstream drivergo_api {
    server 127.0.0.1:18081;
    keepalive 16;
    keepalive_timeout 55s;
}

upstream drivergo_web {
    server 127.0.0.1:13010;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream drivergo_media {
    server 127.0.0.1:9010;
    keepalive 8;
    keepalive_timeout 55s;
}

name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avtotest
          POSTGRES_PASSWORD: avtotest
          POSTGRES_DB: avtotest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avtotest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Packages that call redisx.NewTest (auth, demo, arena, leaderboard,
      # session, server) FlushDB a per-package logical DB. Without Redis the
      # job either skips reality or fails loudly — keep CI honest.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: backend
          # go.mod is 1.26.5; action default v1.x binaries are built with older Go
          # and refuse to load. Pin a v2 release built with go1.26+.
          version: v2.12.2
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://avtotest:avtotest@localhost:5432/avtotest_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -p 1 ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # FE-only Playwright smoke (landing + auth shells + unauth redirects).
  # Auth-gated session-shell cases run only when repo secret E2E_AUTH_TOKEN is
  # set (injected as the `at` cookie — see frontend/e2e/helpers/auth.ts).
  # Absent secret → those tests skip; job stays green. Do not commit tokens.
  # Full-stack API journeys still need staging/compose (inventory U-14).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: true
          # Avoid colliding with anything else on the runner; webServer reads PORT.
          PORT: "3000"
          # Empty when the secret is unset → auth-gated specs skip.
          E2E_AUTH_TOKEN: ${{ secrets.E2E_AUTH_TOKEN }}
          E2E_REFRESH_TOKEN: ${{ secrets.E2E_REFRESH_TOKEN }}

  # Standing dependency vulnerability scan (inventory U-43).
  # Go: govulncheck is a hard gate (symbol-reachable vulns fail the job).
  # npm: audit always runs and uploads JSON; critical/high currently include
  # transitive Next 14 / next-intl 3 issues that need major upgrades — report
  # as warnings so the scan stays standing without blocking on deferred majors.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: govulncheck
        working-directory: backend
        run: govulncheck ./...

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: npm audit report
        working-directory: frontend
        run: |
          set +e
          npm audit --json > "${GITHUB_WORKSPACE}/npm-audit.json"
          npm audit --audit-level=high
          status=$?
          if [ "$status" -ne 0 ]; then
            echo "::warning::npm audit found high/critical issues (see npm-audit.json). FE majors for Next/next-intl deferred — inventory U-43."
          fi
          exit 0
      - name: Upload npm audit JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore

# Stable production slot.
#
# keepalive_timeout is pinned rather than left at nginx's 60s default because it
# is half of a cross-process invariant: nginx ignores the upstream's
# `Keep-Alive: timeout=` header and will reuse a pooled socket for this long, so
# every upstream MUST hold its end open longer than this or nginx writes into a
# socket the upstream already closed ("upstream prematurely closed connection").
# GET survives that -- nginx retries it -- but POST is non-idempotent and is not
# retried, so the browser gets a bare 502. See deploy/tests/compose_contract_test.py
# ::test_next_outlives_nginx_upstream_keepalive, which enforces the margin.
#
#   Go api  : http.Server IdleTimeout 60s   (backend/cmd/api/main.go)
#   Next web: KEEP_ALIVE_TIMEOUT 70000ms    (deploy/docker-compose.prod.yml)
#
# Go's 60s only ties nginx's 60s, so api is pinned to 55s to keep nginx strictly
# first to close there too.
upstream drivergo_api {
    server 127.0.0.1:8081;
    keepalive 16;
    keepalive_timeout 55s;
}

upstream drivergo_web {
    server 127.0.0.1:3010;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream drivergo_media {
    server 127.0.0.1:9010;
    keepalive 8;
    keepalive_timeout 55s;
}

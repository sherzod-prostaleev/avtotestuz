# Driver Go — Cloudflare → nginx → Docker (127.0.0.1 only)
#
# THIS FILE MIRRORS PRODUCTION. Keep it that way.
#
# An earlier version of this file described a different architecture entirely
# (nginx terminating TLS with Let's Encrypt certificates, HTTP→HTTPS redirect,
# client_max_body_size 2m) while production ran plain HTTP on :80 behind
# Cloudflare with a 50m body limit and no certificate for this domain at all.
# Nothing copies this file to the server, so the drift went unnoticed until a
# deploy nearly applied it — which would have cut the upload limit and, with no
# /etc/letsencrypt/live/drivergo.uz/ present, taken nginx down outright.
#
# That hardened variant is preserved in nginx-drivergo.uz.tls-origin.conf,
# together with the steps it needs. It is NOT what runs today.
#
# TLS is terminated by Cloudflare, not here: nginx listens on plain :80 and
# $remote_addr is rewritten to the true visitor IP by real_ip_header
# CF-Connecting-IP plus the set_real_ip_from ranges below.
#
# Install:
#   install -d -m 0755 /etc/nginx/snippets
#   install -m 0644 deploy/nginx/upstreams-stable.conf /etc/nginx/snippets/drivergo-upstreams.conf
#   diff /etc/nginx/sites-available/drivergo.uz deploy/nginx-drivergo.uz.conf
#   cp /etc/nginx/sites-available/drivergo.uz /root/nginx-drivergo.uz.bak-$(date -u +%Y%m%dT%H%M%S)
#   cp deploy/nginx-drivergo.uz.conf /etc/nginx/sites-available/drivergo.uz
#   ln -sf /etc/nginx/sites-available/drivergo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Always diff first and keep the backup — the server is the source of truth
# whenever the two disagree.
#
# Ports (do not collide with other projects):
#   web  → 127.0.0.1:3010
#   api  → 127.0.0.1:8081
#   minio→ 127.0.0.1:9010

# Origin lockdown. Cloudflare fronts this site, but nginx answers on the VPS's
# public IP too, so anyone who learns that IP could bypass Cloudflare entirely —
# its WAF, its rate limiting, its bot rules — and reach the app directly. This
# map matches on $realip_remote_addr, the original TCP peer *before* real_ip
# rewrites it, so a forged CF-Connecting-IP header cannot fake membership.
#
# Keep this list current with https://www.cloudflare.com/ips/ — a range added by
# Cloudflare and not added here starts returning 444 to real visitors.
# It scopes to this virtual host only; other sites on this VPS are unaffected.
geo $realip_remote_addr $drivergo_cloudflare_origin {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Classroom-station endpoints are unauthenticated by necessity: a school PC has
# no session until it proves key possession. The app rate-limits them by station
# identity and by IP, but every such check is itself a Redis round trip on a Redis
# shared with sessions, OTP and Arena -- a pure flood with no valid station id
# still spends that budget. This caps request rate per real client IP at the edge.
# $binary_remote_addr is the true client IP here: real_ip_header CF-Connecting-IP
# plus the Cloudflare set_real_ip_from ranges below rewrite $remote_addr.
#
# This zone read 60r/m burst=200 until 2026-08-26, above a comment that argued
# "~10 req/hour per live PC, up to ~100 PCs behind one school IP => ~0.28 req/s;
# 60r/m gives 3x headroom". The steady-state arithmetic was right. The
# conclusion was not, because 60r/m is not three schools' worth of anything --
# it is ONE REQUEST PER SECOND FOR THE ENTIRE BUILDING, shared by every PC in
# it, since a school reaches us through a single NAT'd gateway.
#
# What that cost. "Avtomotohavaskorlar BUXORO" installed the kiosk agent on 55
# classroom PCs on 2026-08-26 and most of them failed to come up. That day's
# access log holds 7107 responses with status 429, and 7089 of them are from
# 213.230.92.213 -- the school's gateway, i.e. all 55 PCs at once. By URI:
# /api/v1/b2b/stations/challenge 4584, .../token 2446, .../diag 32,
# .../enroll 22, .../agent-manifest 13, essentially all of it inside the
# 14:00-15:00 (+0200) install window. burst=200 was spent in the opening
# seconds of the rollout; from then on the whole school was metered at 1 req/s
# while the fleet needed far more, so the bucket never refilled faster than it
# was drained and the school could not climb back out while class was running.
#
# Re-sized for a 100-PC school -- the fleet size the enroll-code design itself
# targets (EnrollCodeRow in enroll_code.go):
#
#   Steady state. Station token TTL is 15 minutes and the agent renews with a
#   2-minute margin (tokenRenewMargin), so a live PC needs ~5 challenge+token
#   pairs an hour, 2 requests each: ~10 req/hour/PC. 100 PCs = ~1000 req/hour
#   = ~17 req/min.
#
#   Cold boot. A lab switched on by one bell does enroll + challenge + token
#   together, and the updater's first manifest poll follows two minutes later
#   with no jitter at all (Run in updater.go), so ~4 requests per PC arriving
#   within seconds of each other: ~400 requests for 100 PCs, compressed into
#   far less than a minute. That is what burst has to swallow, and 200 could
#   not.
#
# rate=600r/m with burst=600:
#   - steady state spends ~17 of 600 req/min, ~35x headroom, and -- the
#     property that actually failed in Buxoro -- the bucket now refills an
#     order of magnitude faster than a whole fleet can drain it, so a spent
#     burst is back within seconds instead of never.
#   - a ~400-request cold boot fits inside burst=600 with room for the lab to
#     be re-imaged and rolled out a second time the same afternoon.
#   - the incident itself peaked near 180 req/min from those 55 PCs (7089
#     rejected, plus the ~60/min the old ceiling did serve). The same failure
#     on a 100-PC school would be ~330 req/min, still inside this ceiling. A
#     fix landing separately in the agent removes that amplifier -- a failed
#     token is negatively cached instead of re-requested on every proxied API
#     call -- but the edge should not have needed that fix to keep a 55-PC
#     school online, and now it does not.
#
# Deliberately no longer the tight control. The Go handlers keep their own
# hourly per-IP buckets on exactly these endpoints -- enrollIPLimit,
# challengeIPLimit, tokenIPLimit, 1500/hour each (station_handlers.go) --
# which is at most 4500 req/hour, ~75 req/min, for one IP across all three.
# 600r/m is 36000 req/hour, ~8x looser than that aggregate, so the application
# limiter -- the one that knows what a station id is and can tell a real
# station from a guess -- is always what fires on sustained abuse. nginx keeps
# only the job it does better: stopping a pure flood, no valid station id and
# no intention of ever holding one, before it reaches Redis at all. Per request
# that flood buys one nonce insert or one ed25519 verify, so 10 req/s per IP is
# a ceiling, not an invitation.
#
# limit_req_status 429, not nginx's default 503, so a throttled agent can tell
# "retry later" apart from "backend is down".
limit_req_zone $binary_remote_addr zone=station_ip:10m rate=600r/m;

# The 6 MB self-update download gets its own bucket. It shared station_ip until
# 2026-08-26, on the argument that "one classroom checking every six hours is
# nothing next to the 60r/m budget, and an abuser should not get a cheaper path
# to 6 MB than to a token request". The first half survives the re-sizing above;
# the second half does not. Raising the control ceiling to 600r/m was justified
# by what a control call costs -- one nonce insert, one signature check -- and a
# binary download shares none of that arithmetic: left on the shared zone it
# would now authorise 10 x 6 MB/s, ~60 MB/s of egress per IP, ~200 GB/hour, off
# a VPS that also serves the four other sites on this box.
#
# 12r/m -- one download per five seconds per IP -- caps that at ~1.2 MB/s
# sustained instead, and costs a real school nothing: 100 PCs check the
# manifest once per six hours, and only a published version bump turns a check
# into a download, so the legitimate sustained rate here is well under 1
# req/min even on release day. The unjittered poll does make those 100
# downloads arrive together, which is what burst is for -- see the location
# block below. 1m of state, not 10m: nginx keeps ~16k 64-byte states per
# megabyte, and the population on this path is school gateways, a few hundred
# of them, not the open internet.
#
# Splitting also ends a coupling that was never intended: on one shared zone a
# release-day download storm could 429 the challenge and token calls keeping a
# classroom's kiosks alive, and a rollout's control traffic could equally block
# the update it was trying to fetch.
limit_req_zone $binary_remote_addr zone=station_agent_ip:1m rate=12r/m;

# The stock `combined` format records neither how long a request took nor which
# upstream answered it, so a latency regression is invisible here and a 502 does
# not say whether it came from Next or from Go. That is how the keep-alive
# mismatch of 2026-08-14 went unnoticed for a week: the failures were plainly in
# error.log, but access.log could not show that POST /api/proxy/.../answers was
# the request being lost, nor that it cost 0ms (a dead socket) rather than
# timing out. rt/urt/us/ua are the four fields needed to tell those apart:
#   rt  = total time nginx spent on the request
#   urt = time the upstream spent (rt - urt is nginx's own overhead + client I/O)
#   us  = upstream's status (differs from $status when nginx rewrites an error)
#   ua  = which upstream answered (proves web-vs-api when triaging)
# Defined here rather than in nginx.conf so the four other sites on this box
# keep their existing format and log volume.
log_format drivergo_timed
    '$remote_addr - $remote_user [$time_local] "$request" '
    '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
    'rt=$request_time urt=$upstream_response_time us=$upstream_status ua=$upstream_addr';

# Empty Connection when the client is not upgrading: required for upstream
# keepalive. Hardcoding Connection "upgrade" on location / opened a new TCP
# socket to Next on every HTML/BFF request and defeated keepalive 16.
map $http_upgrade $drivergo_connection_upgrade {
    default upgrade;
    ''      "";
}

# Installed by deploy/switch-app-slot.sh. The file contains only upstream
# blocks, so switching it is atomic and nginx -t can validate before reload.
include /etc/nginx/snippets/drivergo-upstreams.conf;

server {
    listen 80;
    server_name drivergo.uz www.drivergo.uz;

    # Refuse anything that did not arrive through Cloudflare. 444 closes the
    # connection without a response, so a scanner probing the raw IP learns
    # nothing about what runs here.
    if ($drivergo_cloudflare_origin = 0) { return 444; }

    # Own file, own format: /var/log/nginx/access.log stays as the four other
    # sites on this box expect it, and drivergo's timings can be aggregated
    # without filtering that shared stream first. Rotated by the existing
    # /etc/logrotate.d/nginx glob.
    access_log /var/log/nginx/drivergo-access.log drivergo_timed;

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Cloudflare Cache Rules (dashboard, not this file): cache /_next/static/*
    # and /media/images/* while ignoring cookies. HTML stays DYNAMIC (no-store).

    # Cloudflare Real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Arena WebSocket (must upgrade; long-lived duel sessions).
    location = /api/v1/arena/ws {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Support chat WebSocket (learner).
    location = /api/v1/support/ws {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Support chat WebSocket (admin inbox).
    location = /admin/v1/support/ws {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Machine-to-machine only: humo-watcher reaches these over the compose
    # network (API_BASE_URL=http://api:8080), never through this proxy. They
    # are mounted on the same /api/v1 router as the public API, so without
    # this block the internet could POST forged "payment received" events and
    # GET the decrypted Telethon session — i.e. mint free VIP and take over
    # the payment-monitoring Telegram account. nginx picks the longest
    # matching prefix, so this wins over /api/v1/ regardless of order.
    location /api/v1/internal/ {
        deny all;
    }

    # Listed ahead of the general /api/v1/ block purely for readability;
    # nginx picks the longest matching prefix regardless of order.
    # The self-update download: ~6 MB of Windows binary, not a JSON control
    # call. Streamed rather than buffered through a temp file, and given room
    # to finish over a driving school's connection. Exact-match so it wins over
    # the prefix block below; the ?v= the agent appends plays no part in
    # location matching. Rate limited out of station_agent_ip rather than the
    # control zone since 2026-08-26 -- see that zone above for why 6 MB no
    # longer belongs on the same budget as a nonce insert. burst stays 200: an
    # unjittered fleet checks the manifest together, so a version bump sends a
    # whole 100-PC lab here at once and 200 covers that plus the retries after
    # a transfer a school's link dropped. It is not raised alongside the
    # control zone's burst because a burst slot here is 6 MB of egress -- 200
    # of them is already ~1.2 GB -- where on station_ip it is one Redis round
    # trip.
    location = /api/v1/b2b/stations/agent {
        limit_req          zone=station_agent_ip burst=200 nodelay;
        limit_req_status   429;
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    # challenge, token, enroll, diag and agent-manifest: the cheap JSON control
    # calls, everything under this prefix except the binary above. burst=600 is
    # sized for a whole lab cold-booting at once -- see the station_ip zone for
    # that arithmetic and for the 2026-08-26 Buxoro rollout that produced it.
    location /api/v1/b2b/stations/ {
        limit_req          zone=station_ip burst=600 nodelay;
        limit_req_status   429;
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Go API (public webhooks / health). Next BFF stays on /api/admin via web.
    location /api/v1/ {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/v1/ {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass         http://drivergo_api;
        proxy_set_header   Host $host;
    }

    location = /readyz {
        proxy_pass         http://drivergo_api;
        proxy_set_header   Host $host;
    }

    # MinIO bucket "media" (MEDIA_BASE_URL=https://drivergo.uz/media).
    # Exact /media/ is the S3 ListBucket XML (~400KB) — do not proxy it.
    location = /media/ {
        return 404;
    }

    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass         http://drivergo_media/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_buffering    on;
        expires            7d;
        add_header         Cache-Control "public, max-age=604800";
    }

    # Hashed Next assets: keepalive + buffering. Cache-Control is set by Next
    # (immutable, 1y). Avoids websocket Connection: upgrade on this prefix.
    location /_next/static/ {
        proxy_pass         http://drivergo_web;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    on;
        proxy_read_timeout 60s;
    }

    # Next.js app (+ /api/admin BFF)
    location / {
        proxy_pass         http://drivergo_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $drivergo_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}

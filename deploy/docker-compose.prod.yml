# Driver Go production stack — isolated from other host apps.
# Binds ONLY to 127.0.0.1 on non-conflicting ports (nginx terminates TLS/public).
#
# Host layout (recommended):
#   /opt/drivergo/          # git checkout or rsync
#   /opt/drivergo/deploy/app.env
#
# Bring-up:
#   cd /opt/drivergo
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/app.env up -d --build
#
# Tear down this project only:
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/app.env down
#
# Do NOT use host :3000 / :8080 / :5432 / :6379 — other projects own them.

name: drivergo

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: avtotest
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: avtotest
    # Internal only — no host publish (avoids clash with system Postgres :5432).
    volumes:
      - drivergo_pgdata:/var/lib/postgresql/data
      - ../compose/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avtotest"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cpus: "1.50"
    mem_limit: 1536m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [default]

  redis:
    image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
    # maxmemory is set here rather than with CONFIG SET because this command
    # line is the whole configuration: a runtime CONFIG SET is forgotten the
    # next time the container is recreated, which is every deploy.
    #
    # Without it Redis has no ceiling below mem_limit, so memory pressure ends
    # in an OOM kill rather than an eviction -- and the rate limiter fails
    # closed (auth/ratelimit.go), so a dead Redis does not slow a classroom
    # down, it denies every enrol, token and answer in it. 256m against a 512m
    # container leaves room for the AOF rewrite, which briefly needs a second
    # copy of the working set.
    #
    # volatile-ttl evicts the soonest-expiring keys first, which are exactly
    # the disposable ones: rate-limit counters and station nonces. The three
    # keys with no TTL (lb:alltime and the arena ratings) are caches that
    # rebuild themselves, and under this policy they are never chosen -- the
    # cost of that is only a risk if the untimed keys ever fill 256 MB on their
    # own, and today the whole instance is under 2 MB.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - volatile-ttl
    volumes:
      - drivergo_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Internal only — no host publish (avoids clash with system Redis :6379).
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [default]

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    # Nginx proxies /media → this; keep off the public interface.
    ports:
      - "127.0.0.1:9010:9000"
    volumes:
      - drivergo_minio:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    cpus: "0.75"
    mem_limit: 1024m
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [default]

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 1; done
        mc mb --ignore-existing -p local/media
        support_bucket="$${MINIO_SUPPORT_BUCKET:-$${MINIO_BUCKET:-support-attachments}}"
        case "$$support_bucket" in ''|*[!a-z0-9.-]*) echo "invalid support bucket" >&2; exit 2;; esac
        mc mb --ignore-existing -p "local/$$support_bucket"
        # Preserve versions only in the dedicated support bucket.  Do not
        # turn on unbounded versioning for the legacy/public media bucket.
        if [ "$$support_bucket" != media ]; then mc version enable "local/$$support_bucket"; fi
        cat > /tmp/media-public-policy.json <<'POLICY'
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {"AWS": ["*"]},
              "Action": ["s3:GetObject"],
              "Resource": ["arn:aws:s3:::media/images/*"]
            }
          ]
        }
        POLICY
        # One PutBucketPolicy replaces the previous policy atomically. A
        # failed command leaves the prior public-media policy in place.
        mc anonymous set-json /tmp/media-public-policy.json local/media
        rm -f /tmp/media-public-policy.json
        if [ "$$support_bucket" != media ]; then mc anonymous set none "local/$$support_bucket"; fi
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SUPPORT_BUCKET: ${MINIO_SUPPORT_BUCKET:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
    cpus: "0.25"
    mem_limit: 256m
    pids_limit: 64
    networks: [default]

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      # The version stamped into the Windows agent this image serves. Empty by
      # default and it must stay empty: the Dockerfile then reads
      # backend/station/VERSION, which is the version of record. This used to
      # default to 1.0.0, so every rebuild where the operator did not type
      # STATION_VERSION=... on the command line -- which is every backend
      # deploy since 2026-08-07 -- shipped an agent reporting 1.0.0, and
      # b2b_station.agent_version said 1.0.0 for the whole fleet. Set the
      # variable only for a deliberate one-off build.
      args:
        STATION_VERSION: ${STATION_VERSION:-}
        VCS_REF: ${VCS_REF:-unknown}
    image: ${API_IMAGE:-drivergo-api:local}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8081}:8080"
    env_file:
      - path: app.env
        required: true
    environment:
      ENV: ${ENV:?ENV is required}
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      # Empty preserves compatibility: backend falls back to legacy
      # MINIO_BUCKET, then to support-attachments.
      MINIO_SUPPORT_BUCKET: ${MINIO_SUPPORT_BUCKET:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_LEGACY_SUPPORT_BUCKET: ${MINIO_LEGACY_SUPPORT_BUCKET:-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:?MEDIA_BASE_URL is required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?PUBLIC_BASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OTP_CHANNEL: ${OTP_CHANNEL:?OTP_CHANNEL is required}
      CLIENT_IP_ASSERTION_SECRET: ${CLIENT_IP_ASSERTION_SECRET:?CLIENT_IP_ASSERTION_SECRET is required}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-off}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_QUIZ_WINNER_STICKER: ${TELEGRAM_QUIZ_WINNER_STICKER:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_ENV: ${PAYME_ENV:?PAYME_ENV is required}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_TEST_KEY: ${PAYME_TEST_KEY:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      # Legacy shared-token Ops routes stay disabled in production. Their UI
      # has moved to /admin and HttpOnly-cookie RBAC.
      OPS_ADMIN_TOKEN: ""
      MANUAL_PAY_INGEST_TOKEN: ${MANUAL_PAY_INGEST_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      ADMIN_TOTP_ENFORCE: ${ADMIN_TOTP_ENFORCE:?ADMIN_TOTP_ENFORCE is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cpus: "1.50"
    mem_limit: 1024m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app, default]

  humo-watcher:
    build:
      context: ../services/humo-watcher
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
    image: ${HUMO_WATCHER_IMAGE:-drivergo-humo-watcher:local}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8080/api/v1}
      MANUAL_PAY_INGEST_TOKEN: ${MANUAL_PAY_INGEST_TOKEN:-}
      HUMO_CREDS_POLL_SEC: ${HUMO_CREDS_POLL_SEC:-30}
      HUMO_QUEUE_DB: /data/humo-queue.sqlite3
      HUMO_HEALTH_PORT: "8088"
    volumes:
      - drivergo_humo_queue:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
    image: ${WEB_IMAGE:-drivergo-web:local}
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3010}:3000"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://api:8080}
      CLIENT_IP_ASSERTION_SECRET: ${CLIENT_IP_ASSERTION_SECRET}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-2}
      NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
      # Read by .next/standalone/server.js and assigned to Node's
      # server.keepAliveTimeout. Node's 5s default is SHORTER than the 60s
      # nginx reuses a pooled socket for, and nginx ignores the
      # `Keep-Alive: timeout=` header Next sends, so the default left a 55s
      # window where nginx wrote requests into sockets Next had already
      # closed -- 502 on every POST that landed in it (answers, events).
      # Must stay strictly above drivergo_web's keepalive_timeout in
      # deploy/nginx/upstreams-*.conf; the contract test enforces it.
      KEEP_ALIVE_TIMEOUT: ${WEB_KEEP_ALIVE_TIMEOUT_MS:-70000}
      # JS runs on one thread, and every authenticated call plus every SSR
      # render goes through this process. Measured at cpus 1.50 with a single
      # worker, while the Go API idled at 35%: BFF ~195 rps, SSR ~45 rps, versus
      # ~1500 rps for the same JSON straight from Go. cluster.js forks this many
      # workers behind the one listening socket. 1 = previous behaviour exactly.
      WEB_WORKERS: ${WEB_WORKERS:-2}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    # Raised with WEB_WORKERS: two saturated JS threads need more than 1.5. The
    # box has 4 vCPU and these limits are caps, not reservations -- api measured
    # 0.35 while web was pegged, so the contention window is small.
    cpus: "${WEB_CPUS:-2.50}"
    mem_limit: 1024m
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app]

volumes:
  drivergo_humo_queue:
  drivergo_pgdata:
  drivergo_redisdata:
  drivergo_minio:

networks:
  app:
    name: drivergo_app
  default:
    # Keep the original Compose network key and name. Existing production
    # networks carry com.docker.compose.network=default; renaming this key
    # would fail label validation during an in-place upgrade.
    name: drivergo_default

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Driver Go">
  <defs>
    <linearGradient id="asphalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <radialGradient id="amberGlow" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#D97706" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberBulb" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </radialGradient>
    <linearGradient id="roadFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="laneAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect width="512" height="512" rx="112" fill="url(#asphalt)"/>

  <!-- Soft amber bloom -->
  <circle cx="256" cy="200" r="168" fill="url(#amberGlow)"/>

  <!-- Signal bezel -->
  <circle cx="256" cy="198" r="118" fill="#0B1220" stroke="#475569" stroke-width="10"/>
  <circle cx="256" cy="198" r="108" fill="none" stroke="#64748B" stroke-width="3" stroke-opacity="0.45"/>

  <!-- Amber signal lens -->
  <circle cx="256" cy="198" r="92" fill="url(#amberBulb)"/>
  <!-- Specular highlight -->
  <ellipse cx="222" cy="162" rx="28" ry="18" fill="#FFFFFF" fill-opacity="0.55"/>
  <ellipse cx="236" cy="176" rx="12" ry="8" fill="#FFFFFF" fill-opacity="0.25"/>

  <!-- Perspective asphalt road -->
  <path d="M 214 290 L 118 470 H 394 L 298 290 Z" fill="url(#roadFill)" stroke="#475569" stroke-width="3"/>
  <!-- Shoulder lines -->
  <path d="M 228 298 L 148 462" fill="none" stroke="#64748B" stroke-width="3" stroke-opacity="0.55"/>
  <path d="M 284 298 L 364 462" fill="none" stroke="#64748B" stroke-width="3" stroke-opacity="0.55"/>
  <!-- Dashed center lane -->
  <path
    d="M 256 308 L 256 338 M 256 362 L 256 398 M 256 422 L 256 456"
    fill="none"
    stroke="url(#laneAmber)"
    stroke-width="10"
    stroke-linecap="round"
  />
</svg>

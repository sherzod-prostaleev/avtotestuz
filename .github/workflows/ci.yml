name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avtotest
          POSTGRES_PASSWORD: avtotest
          POSTGRES_DB: avtotest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avtotest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          working-directory: backend
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://avtotest:avtotest@localhost:5432/avtotest_test?sslmode=disable
        run: go test -p 1 ./... -count=1

  # Frontend job removed 2026-07-21: the Flutter app was retired (stack
  # pivot — see AVTOTEST-MASTER-PROMPT.txt §0). A new job will be added
  # when the Next.js frontend lands.

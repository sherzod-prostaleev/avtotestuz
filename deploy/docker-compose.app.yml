# App services (API + Next.js) — overlay on the root infra compose.
#
# Infra (postgres / redis / minio) stays in the repo-root docker-compose.yml.
# This file only adds the application containers so local staging can reuse
# an already-running `make up` stack.
#
# Usage (from repo root):
#   make up
#   cp deploy/app.env.example deploy/app.env   # edit secrets / URLs (gitignored)
#   docker compose -f docker-compose.yml -f deploy/docker-compose.app.yml \
#     --env-file deploy/app.env up -d --build api web
#
# Health / smoke:
#   ./deploy/smoke.sh http://localhost:8080 http://localhost:3000
#
# Tear down apps only (keep infra):
#   docker compose -f docker-compose.yml -f deploy/docker-compose.app.yml stop api web
#
# Secrets: ONLY via --env-file / shell env. Never put real JWT, OTP, payment,
# or Telegram tokens in this YAML. See STAGING-RUNBOOK.md.
#
# Resource notes (optional — uncomment after sizing the staging VPS):
#   deploy:
#     resources:
#       limits:
#         cpus: "1.0"
#         memory: 512M      # api is a static Go binary; 256–512M is typical
#       # web (Next standalone): often 512M–1G under concurrent SSR

services:
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        # Empty on purpose -- backend/station/VERSION is the version of record.
        # See the same block in docker-compose.prod.yml.
        STATION_VERSION: ${STATION_VERSION:-}
        VCS_REF: ${VCS_REF:-unknown}
    # Override after registry push, e.g. API_IMAGE=ghcr.io/org/avtotest-api:sha
    image: ${API_IMAGE:-avtotest-api:local}
    # Bind to loopback only: /api/v1/internal/* returns decrypted Telethon
    # credentials and accepts forged payment events. In production those
    # routes are only safe because nginx (deploy/nginx-drivergo.uz.conf) has
    # `location /api/v1/internal/ { deny all; }` in front — publishing this
    # port on all interfaces would expose them directly, bypassing nginx.
    # Same pattern as deploy/docker-compose.prod.yml. Use an SSH tunnel or
    # `docker compose exec` for host access; do not widen this to 0.0.0.0.
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8080}:8080"
    env_file:
      # Compose still expands ${VAR} below from the process/--env-file used at
      # `up` time; listing app.env here also injects undeclared keys safely.
      # File must exist on the host (copy from app.env.example).
      - path: app.env
        required: false
    environment:
      ENV: ${ENV:-dev}
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:-postgres://avtotest:avtotest@postgres:5432/avtotest?sslmode=disable}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-avtotest}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-avtotest123}
      MINIO_SUPPORT_BUCKET: ${MINIO_SUPPORT_BUCKET:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-}
      MINIO_LEGACY_SUPPORT_BUCKET: ${MINIO_LEGACY_SUPPORT_BUCKET:-media}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MEDIA_BASE_URL: ${MEDIA_BASE_URL:-http://localhost:9000/media}
      # Frontend origin users browse (referral invite links, payment return URLs).
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      OTP_CHANNEL: ${OTP_CHANNEL:-sandbox}
      CLIENT_IP_ASSERTION_SECRET: ${CLIENT_IP_ASSERTION_SECRET:-}
      TELEGRAM_GATEWAY_TOKEN: ${TELEGRAM_GATEWAY_TOKEN:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_MODE: ${TELEGRAM_BOT_MODE:-off}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_QUIZ_WINNER_STICKER: ${TELEGRAM_QUIZ_WINNER_STICKER:-}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_ENV: ${PAYME_ENV:-test}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_TEST_KEY: ${PAYME_TEST_KEY:-}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      OPS_ADMIN_TOKEN: ${OPS_ADMIN_TOKEN:-}
      MANUAL_PAY_INGEST_TOKEN: ${MANUAL_PAY_INGEST_TOKEN:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/healthcheck", "http://127.0.0.1:8080/readyz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app, data]

  humo-watcher:
    build:
      context: ../services/humo-watcher
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
    image: ${HUMO_WATCHER_IMAGE:-avtotest-humo-watcher:local}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://api:8080/api/v1}
      MANUAL_PAY_INGEST_TOKEN: ${MANUAL_PAY_INGEST_TOKEN:-}
      HUMO_CREDS_POLL_SEC: ${HUMO_CREDS_POLL_SEC:-30}
      HUMO_QUEUE_DB: /data/humo-queue.sqlite3
      HUMO_HEALTH_PORT: "8088"
    volumes:
      - avtotest_humo_queue:/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app]

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VCS_REF: ${VCS_REF:-unknown}
    image: ${WEB_IMAGE:-avtotest-web:local}
    # Bind to loopback only, same reasoning as the api service above — this
    # overlay has no nginx/TLS terminator of its own; a real deploy fronts
    # both with a reverse proxy (see deploy/nginx-drivergo.uz.conf).
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"
    environment:
      # Server-side BFF → API (compose DNS name, not localhost).
      BACKEND_URL: ${BACKEND_URL:-http://api:8080}
      # Required in the production Next image; must match API.
      CLIENT_IP_ASSERTION_SECRET: ${CLIENT_IP_ASSERTION_SECRET:-}
      # Direct browser→Next (no reverse proxy in this overlay) → use a
      # front proxy in real staging and set hops accordingly (see runbook).
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /app/.next/cache:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    stop_grace_period: 30s
    # Node alpine includes wget — liveness must stay a cheap JSON/text probe,
    # never a full locale document (that SSR competes with real users).
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:3000/api/healthz",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks: [app]

volumes:
  avtotest_humo_queue:

networks:
  app:
  data:

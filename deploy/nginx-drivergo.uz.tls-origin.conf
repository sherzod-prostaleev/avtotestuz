# Driver Go — Cloudflare → TLS nginx origin → Docker (127.0.0.1 only)
#
# ============================================================================
# NOT DEPLOYED. This is the hardened variant, kept for when someone decides to
# move TLS termination onto the origin. What runs today is
# nginx-drivergo.uz.conf: plain :80 behind Cloudflare, no certificate for this
# domain on the server at all.
#
# The origin-lockdown half of this file (the geo map + `return 444`) has ALREADY
# been merged into the live config — that part needed no certificate and closed
# the direct-to-origin bypass on its own. What remains here and is NOT applied:
# TLS on :443, the :80 → :443 redirect, and IPv6 listeners.
#
# Before applying, all four must be true, in this order:
#
#   1. A certificate exists for this domain. As of 2026-08-05 the server had
#      /etc/letsencrypt/live/bigwin.space/ only — nothing for drivergo.uz — so
#      copying this file would fail `nginx -t` and leave nginx down. certbot is
#      already installed:
#          certbot certonly --nginx -d drivergo.uz -d www.drivergo.uz
#      Note the HTTP-01 challenge must reach :80, so issue the cert BEFORE the
#      `return 444` lockdown can refuse Let's Encrypt's validators, or use
#      --dns-cloudflare instead.
#   2. Port 443 is open on the VPS firewall and nothing else binds it. As of
#      2026-08-05 nothing listened on 443.
#   3. Cloudflare's SSL/TLS mode is set to Full (strict). If it is left on
#      Flexible, Cloudflare speaks HTTP to an origin that now 308-redirects
#      HTTP to HTTPS, and every request becomes a redirect loop.
#   4. client_max_body_size below says 2m; production runs 50m. Reconcile that
#      deliberately — 2m will reject admin media uploads that work today.
#
# Reversal: keep a backup of the live file and `nginx -t` before every reload;
# if anything fails, restore the backup and reload.
# ============================================================================
#
# Install:
#   cp deploy/nginx-drivergo.uz.tls-origin.conf /etc/nginx/sites-available/drivergo.uz
#   ln -sf /etc/nginx/sites-available/drivergo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Required certificate files (0600 key, root-owned):
#   /etc/letsencrypt/live/drivergo.uz/fullchain.pem
#   /etc/letsencrypt/live/drivergo.uz/privkey.pem
# Cloudflare SSL/TLS mode must be Full (strict).
#
# Ports (do not collide with other projects):
#   web  → 127.0.0.1:3010
#   api  → 127.0.0.1:8081
#   minio→ 127.0.0.1:9010

# Check the original TCP peer, not the visitor address restored by real_ip.
# This limits only the Driver Go virtual host and does not alter firewall rules
# for unrelated sites sharing this VPS.
geo $realip_remote_addr $drivergo_cloudflare_origin {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Station rate limit: one bucket per client IP, sized for how a real
# classroom rolls out and re-authenticates, not for a single laptop.
#
# Steady state: a live classroom PC needs roughly 4-5 challenge+token pairs
# an hour (the access token TTL is 15 minutes, so ~4 renewals/hour plus
# slack for retries/clock drift) -- 2 requests per pair, so ~10 req/hour/PC.
# Many PCs in one school share one public IP behind NAT: a 100-PC rollout
# is ~1000 req/hour/IP at steady state, ~0.28 req/s. rate=60r/m (1 req/s)
# leaves >3x headroom over that, enough for a school that grows past 100
# PCs or has some retry churn, without opening the door very wide.
#
# Bursty state: enrollment is pushed to 30-100 PCs at once via GPO, so on a
# rollout day this IP can see on the order of 100 enroll requests within a
# short window, stacked on top of whatever challenge/token traffic is
# already in flight from PCs enrolled earlier. burst=200 (with nodelay, so
# a request inside the burst allowance passes immediately instead of
# queuing behind an artificial delay) absorbs that -- and a repeat of it --
# without rejecting a single legitimate PC. Generous on purpose: a rate
# limit that breaks a legitimate rollout is worse than one that is merely a
# ceiling.
#
# limit_req_status 429, not nginx's default 503, so a throttled station
# agent can tell "rate limited, retry later" apart from "backend is down"
# and back off accordingly instead of treating both the same.
limit_req_zone $binary_remote_addr zone=station_ip:10m rate=60r/m;

server {
    listen 80;
    listen [::]:80;
    server_name drivergo.uz www.drivergo.uz;

    if ($drivergo_cloudflare_origin = 0) { return 444; }
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drivergo.uz www.drivergo.uz;

    if ($drivergo_cloudflare_origin = 0) { return 444; }

    ssl_certificate /etc/letsencrypt/live/drivergo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drivergo.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DriverGoTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # Cloudflare Real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Arena WebSocket (must upgrade; long-lived duel sessions).
    location = /api/v1/arena/ws {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Support chat WebSocket (learner).
    location = /api/v1/support/ws {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Support chat WebSocket (admin inbox).
    location = /admin/v1/support/ws {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Machine-to-machine only: humo-watcher reaches these over the compose
    # network (API_BASE_URL=http://api:8080), never through this proxy. They
    # are mounted on the same /api/v1 router as the public API, so without
    # this block the internet could POST forged "payment received" events and
    # GET the decrypted Telethon session — i.e. mint free VIP and take over
    # the payment-monitoring Telegram account. nginx picks the longest
    # matching prefix, so this wins over /api/v1/ regardless of order.
    location /api/v1/internal/ {
        deny all;
    }

    # The three unauthenticated classroom-station endpoints
    # (backend/internal/b2b/station_handlers.go's PublicRoutes: enroll,
    # challenge, token) -- a classroom PC has no session until it proves
    # key possession here, so these cannot require auth and are reachable
    # by anyone on the internet. The app already rate-limits them by
    # station identity and, once asserted, by IP (see station_handlers.go's
    # allow doc comment), but every one of those checks is itself a Redis
    # round trip on a Redis shared with sessions, OTP and Arena -- a pure
    # volumetric flood, with no valid station id or enrollment code at all,
    # still spends that Redis budget on every request before the app gets a
    # chance to say no. This zone caps the request rate per source IP at
    # the edge, before proxying, so a flood never reaches the app or Redis
    # in the first place; it is a floor under the app-level limiter, not a
    # replacement for it. Listed before the general /api/v1/ location for
    # readability -- nginx already picks the longest matching prefix
    # regardless of order, same as the /api/v1/internal/ block above.
    location /api/v1/b2b/stations/ {
        limit_req          zone=station_ip burst=200 nodelay;
        limit_req_status   429;
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Go API (public webhooks / health). Next BFF stays on /api/admin via web.
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
    }

    location = /readyz {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
    }

    # MinIO bucket "media" (MEDIA_BASE_URL=https://drivergo.uz/media)
    location /media/ {
        proxy_pass         http://127.0.0.1:9010/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_buffering    off;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # Next.js app (+ /api/admin BFF)
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}

# U-42 — optional k6 smoke. Not a required PR check.
# Default runners have no staging API; operators dispatch with a reachable base URL.
name: load-test

on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Reachable API base URL (e.g. http://127.0.0.1:8090 or staging)"
        required: true
        type: string
      vus:
        description: "Virtual users"
        required: false
        default: "3"
        type: string
      duration:
        description: "k6 duration"
        required: false
        default: "20s"
        type: string

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg \
            --keyserver hkp://keyserver.ubuntu.com:80 \
            --recv-keys C5B11709182BEA89
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
      - name: Run smoke
        env:
          API_BASE: ${{ inputs.api_base }}
          VUS: ${{ inputs.vus }}
          DURATION: ${{ inputs.duration }}
        run: k6 run -e API_BASE="$API_BASE" -e VUS="$VUS" -e DURATION="$DURATION" deploy/load-test/smoke.js

name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: avtotest
          POSTGRES_PASSWORD: avtotest
          POSTGRES_DB: avtotest_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U avtotest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Packages that call redisx.NewTest (auth, demo, arena, leaderboard,
      # session, server) FlushDB a per-package logical DB. Without Redis the
      # job either skips reality or fails loudly — keep CI honest.
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          working-directory: backend
          # go.mod is 1.26.5; action default v1.x binaries are built with older Go
          # and refuse to load. Pin a v2 release built with go1.26+.
          version: v2.12.2
      - name: Formatting gate
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || { echo "$unformatted"; exit 1; }
      - name: Test
        env:
          TEST_DATABASE_URL: postgres://avtotest:avtotest@localhost:5432/avtotest_test?sslmode=disable
          TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -p 1 ./... -count=1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  # FE-only Playwright smoke (landing + auth shells + unauth redirects).
  # Auth-gated session-shell cases run only when repo secret E2E_AUTH_TOKEN is
  # set (injected as the `at` cookie — see frontend/e2e/helpers/auth.ts).
  # Absent secret → those tests skip; job stays green. Do not commit tokens.
  # Full-stack API journeys still need staging/compose (inventory U-14).
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: E2E smoke
        run: npm run test:e2e
        env:
          CI: true
          # Avoid colliding with anything else on the runner; webServer reads PORT.
          PORT: "3000"
          # Empty when the secret is unset → auth-gated specs skip.
          E2E_AUTH_TOKEN: ${{ secrets.E2E_AUTH_TOKEN }}
          E2E_REFRESH_TOKEN: ${{ secrets.E2E_REFRESH_TOKEN }}

  # Standing dependency vulnerability scan (inventory U-43).
  # Go: govulncheck is a hard gate (symbol-reachable vulns fail the job).
  # npm: high/critical advisories are a hard gate and the JSON is retained as
  # an artifact for review.
  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: govulncheck
        working-directory: backend
        run: govulncheck ./...

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: npm audit (high/critical hard gate)
        working-directory: frontend
        run: |
          set -o pipefail
          npm audit --audit-level=high --json | tee "${GITHUB_WORKSPACE}/npm-audit.json"

      - name: Python dependency audit
        run: |
          python3 -m pip install --disable-pip-version-check pip-audit==2.10.1
          python3 -m pip_audit -r services/humo-watcher/requirements.txt --strict
      - name: Upload npm audit JSON
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-audit
          path: npm-audit.json
          if-no-files-found: ignore

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Validate production Compose
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/app.prod.env.example config >/dev/null
      - name: Build API image
        run: docker build --pull=false -t drivergo-api:ci -f backend/Dockerfile backend
      - name: Build web image
        run: docker build --pull=false -t drivergo-web:ci -f frontend/Dockerfile frontend
      - name: Build Humo watcher image
        run: docker build --pull=false -t drivergo-humo-watcher:ci -f services/humo-watcher/Dockerfile services/humo-watcher

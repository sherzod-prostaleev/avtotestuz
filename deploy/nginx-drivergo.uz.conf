# Driver Go — Cloudflare → nginx → Docker (127.0.0.1 only)
#
# THIS FILE MIRRORS PRODUCTION. Keep it that way.
#
# An earlier version of this file described a different architecture entirely
# (nginx terminating TLS with Let's Encrypt certificates, HTTP→HTTPS redirect,
# client_max_body_size 2m) while production ran plain HTTP on :80 behind
# Cloudflare with a 50m body limit and no certificate for this domain at all.
# Nothing copies this file to the server, so the drift went unnoticed until a
# deploy nearly applied it — which would have cut the upload limit and, with no
# /etc/letsencrypt/live/drivergo.uz/ present, taken nginx down outright.
#
# That hardened variant is preserved in nginx-drivergo.uz.tls-origin.conf,
# together with the steps it needs. It is NOT what runs today.
#
# TLS is terminated by Cloudflare, not here: nginx listens on plain :80 and
# $remote_addr is rewritten to the true visitor IP by real_ip_header
# CF-Connecting-IP plus the set_real_ip_from ranges below.
#
# Install:
#   install -d -m 0755 /etc/nginx/snippets
#   install -m 0644 deploy/nginx/upstreams-stable.conf /etc/nginx/snippets/drivergo-upstreams.conf
#   diff /etc/nginx/sites-available/drivergo.uz deploy/nginx-drivergo.uz.conf
#   cp /etc/nginx/sites-available/drivergo.uz /root/nginx-drivergo.uz.bak-$(date -u +%Y%m%dT%H%M%S)
#   cp deploy/nginx-drivergo.uz.conf /etc/nginx/sites-available/drivergo.uz
#   ln -sf /etc/nginx/sites-available/drivergo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Always diff first and keep the backup — the server is the source of truth
# whenever the two disagree.
#
# Ports (do not collide with other projects):
#   web  → 127.0.0.1:3010
#   api  → 127.0.0.1:8081
#   minio→ 127.0.0.1:9010

# Origin lockdown. Cloudflare fronts this site, but nginx answers on the VPS's
# public IP too, so anyone who learns that IP could bypass Cloudflare entirely —
# its WAF, its rate limiting, its bot rules — and reach the app directly. This
# map matches on $realip_remote_addr, the original TCP peer *before* real_ip
# rewrites it, so a forged CF-Connecting-IP header cannot fake membership.
#
# Keep this list current with https://www.cloudflare.com/ips/ — a range added by
# Cloudflare and not added here starts returning 444 to real visitors.
# It scopes to this virtual host only; other sites on this VPS are unaffected.
geo $realip_remote_addr $drivergo_cloudflare_origin {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

# Classroom-station endpoints are unauthenticated by necessity: a school PC has
# no session until it proves key possession. The app rate-limits them by station
# identity and by IP, but every such check is itself a Redis round trip on a Redis
# shared with sessions, OTP and Arena -- a pure flood with no valid station id
# still spends that budget. This caps request rate per real client IP at the edge.
# $binary_remote_addr is the true client IP here: real_ip_header CF-Connecting-IP
# plus the Cloudflare set_real_ip_from ranges below rewrite $remote_addr.
# ~10 req/hour per live PC, up to ~100 PCs behind one school IP => ~0.28 req/s;
# 60r/m gives 3x headroom, burst=200 absorbs a GPO rollout enrolling a whole lab.
# limit_req_status 429, not nginx's default 503, so a throttled agent can tell
# "retry later" apart from "backend is down".
limit_req_zone $binary_remote_addr zone=station_ip:10m rate=60r/m;

# Empty Connection when the client is not upgrading: required for upstream
# keepalive. Hardcoding Connection "upgrade" on location / opened a new TCP
# socket to Next on every HTML/BFF request and defeated keepalive 16.
map $http_upgrade $drivergo_connection_upgrade {
    default upgrade;
    ''      "";
}

# Installed by deploy/switch-app-slot.sh. The file contains only upstream
# blocks, so switching it is atomic and nginx -t can validate before reload.
include /etc/nginx/snippets/drivergo-upstreams.conf;

server {
    listen 80;
    server_name drivergo.uz www.drivergo.uz;

    # Refuse anything that did not arrive through Cloudflare. 444 closes the
    # connection without a response, so a scanner probing the raw IP learns
    # nothing about what runs here.
    if ($drivergo_cloudflare_origin = 0) { return 444; }

    client_max_body_size 50m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    # Cloudflare Cache Rules (dashboard, not this file): cache /_next/static/*
    # and /media/images/* while ignoring cookies. HTML stays DYNAMIC (no-store).

    # Cloudflare Real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Arena WebSocket (must upgrade; long-lived duel sessions).
    location = /api/v1/arena/ws {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Support chat WebSocket (learner).
    location = /api/v1/support/ws {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Support chat WebSocket (admin inbox).
    location = /admin/v1/support/ws {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Machine-to-machine only: humo-watcher reaches these over the compose
    # network (API_BASE_URL=http://api:8080), never through this proxy. They
    # are mounted on the same /api/v1 router as the public API, so without
    # this block the internet could POST forged "payment received" events and
    # GET the decrypted Telethon session — i.e. mint free VIP and take over
    # the payment-monitoring Telegram account. nginx picks the longest
    # matching prefix, so this wins over /api/v1/ regardless of order.
    location /api/v1/internal/ {
        deny all;
    }

    # Listed ahead of the general /api/v1/ block purely for readability;
    # nginx picks the longest matching prefix regardless of order.
    # The self-update download: ~6 MB of Windows binary, not a JSON control
    # call. Streamed rather than buffered through a temp file, and given room
    # to finish over a driving school's connection. Exact-match so it wins over
    # the prefix block below; the ?v= the agent appends plays no part in
    # location matching. Rate limiting stays, sharing the same zone as the
    # control calls -- one classroom checking every six hours is nothing next
    # to the 60r/m budget, and an abuser should not get a cheaper path to 6 MB
    # than to a token request.
    location = /api/v1/b2b/stations/agent {
        limit_req          zone=station_ip burst=200 nodelay;
        limit_req_status   429;
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_buffering    off;
        proxy_read_timeout 300s;
    }

    location /api/v1/b2b/stations/ {
        limit_req          zone=station_ip burst=200 nodelay;
        limit_req_status   429;
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Go API (public webhooks / health). Next BFF stays on /api/admin via web.
    location /api/v1/ {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/v1/ {
        proxy_pass         http://drivergo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass         http://drivergo_api;
        proxy_set_header   Host $host;
    }

    location = /readyz {
        proxy_pass         http://drivergo_api;
        proxy_set_header   Host $host;
    }

    # MinIO bucket "media" (MEDIA_BASE_URL=https://drivergo.uz/media).
    # Exact /media/ is the S3 ListBucket XML (~400KB) — do not proxy it.
    location = /media/ {
        return 404;
    }

    location /media/ {
        limit_except GET HEAD { deny all; }
        proxy_pass         http://drivergo_media/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_buffering    on;
        expires            7d;
        add_header         Cache-Control "public, max-age=604800";
    }

    # Hashed Next assets: keepalive + buffering. Cache-Control is set by Next
    # (immutable, 1y). Avoids websocket Connection: upgrade on this prefix.
    location /_next/static/ {
        proxy_pass         http://drivergo_web;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   Connection "";
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_buffering    on;
        proxy_read_timeout 60s;
    }

    # Next.js app (+ /api/admin BFF)
    location / {
        proxy_pass         http://drivergo_web;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $drivergo_connection_upgrade;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}

# Driver Go — Cloudflare → TLS nginx origin → Docker (127.0.0.1 only)
# Install:
#   cp deploy/nginx-drivergo.uz.conf /etc/nginx/sites-available/drivergo.uz
#   ln -sf /etc/nginx/sites-available/drivergo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Required certificate files (0600 key, root-owned):
#   /etc/letsencrypt/live/drivergo.uz/fullchain.pem
#   /etc/letsencrypt/live/drivergo.uz/privkey.pem
# Cloudflare SSL/TLS mode must be Full (strict).
#
# Ports (do not collide with other projects):
#   web  → 127.0.0.1:3010
#   api  → 127.0.0.1:8081
#   minio→ 127.0.0.1:9010

# Check the original TCP peer, not the visitor address restored by real_ip.
# This limits only the Driver Go virtual host and does not alter firewall rules
# for unrelated sites sharing this VPS.
geo $realip_remote_addr $drivergo_cloudflare_origin {
    default 0;
    173.245.48.0/20 1;
    103.21.244.0/22 1;
    103.22.200.0/22 1;
    103.31.4.0/22 1;
    141.101.64.0/18 1;
    108.162.192.0/18 1;
    190.93.240.0/20 1;
    188.114.96.0/20 1;
    197.234.240.0/22 1;
    198.41.128.0/17 1;
    162.158.0.0/15 1;
    104.16.0.0/13 1;
    104.24.0.0/14 1;
    172.64.0.0/13 1;
    131.0.72.0/22 1;
    2400:cb00::/32 1;
    2606:4700::/32 1;
    2803:f800::/32 1;
    2405:b500::/32 1;
    2405:8100::/32 1;
    2a06:98c0::/29 1;
    2c0f:f248::/32 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name drivergo.uz www.drivergo.uz;

    if ($drivergo_cloudflare_origin = 0) { return 444; }
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name drivergo.uz www.drivergo.uz;

    if ($drivergo_cloudflare_origin = 0) { return 444; }

    ssl_certificate /etc/letsencrypt/live/drivergo.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drivergo.uz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:DriverGoTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 2m;

    # Cloudflare Real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    # Arena WebSocket (must upgrade; long-lived duel sessions).
    location = /api/v1/arena/ws {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Machine-to-machine only: humo-watcher reaches these over the compose
    # network (API_BASE_URL=http://api:8080), never through this proxy. They
    # are mounted on the same /api/v1 router as the public API, so without
    # this block the internet could POST forged "payment received" events and
    # GET the decrypted Telethon session — i.e. mint free VIP and take over
    # the payment-monitoring Telegram account. nginx picks the longest
    # matching prefix, so this wins over /api/v1/ regardless of order.
    location /api/v1/internal/ {
        deny all;
    }

    # Go API (public webhooks / health). Next BFF stays on /api/admin via web.
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
    }

    location = /readyz {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
    }

    # MinIO bucket "media" (MEDIA_BASE_URL=https://drivergo.uz/media)
    location /media/ {
        proxy_pass         http://127.0.0.1:9010/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_buffering    off;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # Next.js app (+ /api/admin BFF)
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}

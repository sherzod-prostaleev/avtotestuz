openapi: 3.0.3
info:
  title: AvtoTest Admin API (stub)
  version: "0.1.0"
  description: |
    Hand-written route catalog for `/admin/v1` (U-50 wave companion).
    Not generated from code; request/response schemas are intentionally omitted.
    Auth: Bearer admin JWT except `/auth/login` and `/auth/refresh`.
servers:
  - url: /admin/v1
paths:
  /auth/login:
    post: { summary: Admin login, security: [] }
  /auth/refresh:
    post: { summary: Refresh admin tokens, security: [] }
  /auth/logout:
    post: { summary: Logout / revoke refresh }
  /me:
    get: { summary: Current admin profile + permissions }
  /ping:
    get: { summary: Auth smoke }
  /users:
    get: { summary: List users, description: "permission: users.read" }
  /users/{id}:
    get: { summary: User detail, description: "permission: users.read" }
  /users/{id}/sessions:
    get: { summary: List user sessions, description: "permission: users.read" }
  /users/{id}/block:
    post: { summary: Block user, description: "permission: users.block" }
  /users/{id}/unblock:
    post: { summary: Unblock user, description: "permission: users.block" }
  /users/{id}/sessions/revoke-all:
    post: { summary: Revoke all sessions, description: "permission: users.sessions.revoke" }
  /users/{id}/sessions/{sessionID}/revoke:
    post: { summary: Revoke one session, description: "permission: users.sessions.revoke" }
  /content/questions:
    get: { summary: List questions, description: "permission: content.questions.read" }
  /content/questions/{id}:
    get: { summary: Question detail, description: "permission: content.questions.read" }
    patch: { summary: Patch question, description: "permission: content.questions.write" }
  /content/explanations:
    get: { summary: List explanations, description: "permission: content.questions.read" }
  /content/questions/{id}/explanation/verify:
    post: { summary: Verify explanation, description: "permission: content.verify" }
  /payments/transactions:
    get: { summary: List payments, description: "permission: payments.read" }
  /payments/transactions/{id}:
    get: { summary: Payment detail, description: "permission: payments.read" }
  /payments/providers:
    get: { summary: Payment providers, description: "permission: payments.read" }
  /payments/providers/{provider}:
    patch: { summary: Patch provider kill-switch, description: "permission: payments.keys.manage" }
  /payments/recon:
    get: { summary: Payment recon dry-run, description: "permission: payments.read" }
  /cms/contacts:
    get: { summary: CMS contacts, description: "permission: cms.read" }
    put: { summary: Put CMS contacts, description: "permission: cms.write" }
  /cms/home:
    get: { summary: CMS home hero, description: "permission: cms.read" }
    put: { summary: Put CMS home hero, description: "permission: cms.write" }
  /monitoring/health:
    get: { summary: Monitoring health, description: "permission: monitoring.read" }
  /monitoring/metrics:
    get: { summary: Process metrics snapshot, description: "permission: monitoring.read" }
  /monitoring/jobs:
    get: { summary: Job stubs, description: "permission: monitoring.read" }
  /monitoring/feed:
    get: { summary: Ops feed, description: "permission: monitoring.read" }
  /monitoring/alerts:
    get: { summary: Alert rule eval, description: "permission: monitoring.read" }
  /analytics/overview:
    get: { summary: Analytics overview, description: "permission: analytics.read" }
  /investors/overview:
    get: { summary: Investors overview stub, description: "permission: investors.read" }
  /settings/flags:
    get: { summary: Feature flags, description: "permission: settings.flags" }
  /settings/flags/{key}:
    patch: { summary: Patch feature flag, description: "permission: settings.flags" }
  /settings/limits:
    get: { summary: Limit configs, description: "permission: settings.config" }
  /settings/limits/{key}:
    patch: { summary: Patch limit config, description: "permission: settings.config" }
  /security/audit:
    get: { summary: Admin audit log, description: "permission: security.audit.read" }
  /support/conversations:
    get: { summary: Support conversations inbox, description: "permission: support.inbox" }
  /support/conversations/{id}:
    get: { summary: Conversation detail + learner, description: "permission: support.inbox" }
    patch: { summary: Open/close conversation, description: "permission: support.inbox" }
  /support/conversations/{id}/messages:
    post: { summary: Admin reply (text/attachment), description: "permission: support.inbox" }
  /support/conversations/{id}/attachments:
    post: { summary: Admin attachment upload, description: "permission: support.inbox" }
  /support/ws-ticket:
    post: { summary: Mint admin support WS ticket, description: "permission: support.inbox" }
  /support/ws:
    get: { summary: Admin support WebSocket, description: "permission: support.inbox (ticket)" }
  /support/banner:
    get: { summary: Support banner, description: "permission: support.broadcast" }
    put: { summary: Put support banner, description: "permission: support.broadcast" }
  /support/broadcasts/webpush:
    post: { summary: Web-push broadcast, description: "permission: support.broadcast" }
  /b2b/orgs:
    get: { summary: List B2B orgs, description: "permission: users.read" }
    post: { summary: Create B2B org, description: "permission: users.entitlements.grant" }
  /b2b/orgs/{id}:
    get: { summary: B2B org detail, description: "permission: users.read" }
  /b2b/orgs/{id}/members:
    post: { summary: Add member, description: "permission: users.entitlements.grant" }
  /b2b/orgs/{id}/licenses:
    post: { summary: Create license, description: "permission: users.entitlements.grant" }
  /b2b/orgs/{id}/members/{profileID}/grant:
    post: { summary: Grant seat, description: "permission: users.entitlements.grant" }
components:
  securitySchemes:
    adminBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
security:
  - adminBearer: []

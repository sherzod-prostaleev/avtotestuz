# Driver Go — Cloudflare → nginx → Docker (127.0.0.1 only)
# Install:
#   cp deploy/nginx-drivergo.uz.conf /etc/nginx/sites-available/drivergo.uz
#   ln -sf /etc/nginx/sites-available/drivergo.uz /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Ports (do not collide with other projects):
#   web  → 127.0.0.1:3010
#   api  → 127.0.0.1:8081
#   minio→ 127.0.0.1:9010

server {
    listen 80;
    server_name drivergo.uz www.drivergo.uz;

    client_max_body_size 50m;

    # Cloudflare Real IP
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;

    # Arena WebSocket (must upgrade; long-lived duel sessions).
    location = /api/v1/arena/ws {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering    off;
    }

    # Go API (public webhooks / health). Next BFF stays on /api/admin via web.
    location /api/v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /admin/v1/ {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /healthz {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
    }

    location = /readyz {
        proxy_pass         http://127.0.0.1:8081;
        proxy_set_header   Host $host;
    }

    # MinIO bucket "media" (MEDIA_BASE_URL=https://drivergo.uz/media)
    location /media/ {
        proxy_pass         http://127.0.0.1:9010/media/;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_buffering    off;
        expires            7d;
        add_header         Cache-Control "public";
    }

    # Next.js app (+ /api/admin BFF)
    location / {
        proxy_pass         http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering    off;
    }
}
